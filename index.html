<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Super Mario</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="game-container">
      <!-- score -->
      <div class="score">
        <h1>Score : 0</h1>
      </div>

      <!-- game over -->
      <div class="game-over">
        <h1>Game Over</h1>
        <h2 class="final-score">Score : 0</h2>
        <button onclick="restartGame()">Restart</button>
      </div>

      <!-- obstacle -->
      <div class="obstacle">
        <img src="./assets/pipe.png" alt="pipe.png" />
      </div>

      <!-- mario -->
      <div class="mario">
        <img src="./assets/mario.png" alt="mario.png" />
      </div>
    </div>

    <!-- platform -->
    <div class="platform">
      <img src="./assets/platform.png" alt="platform" />
      <img src="./assets/platform.png" alt="platform" />
      <img src="./assets/platform.png" alt="platform" />
      <img src="./assets/platform.png" alt="platform" />
      <img src="./assets/platform.png" alt="platform" />
      <img src="./assets/platform.png" alt="platform" />
      <img src="./assets/platform.png" alt="platform" />
      <img src="./assets/platform.png" alt="platform" />
      <!-- <img src="./assets/platform.png" alt="platform" /> -->
      <!-- <img src="./assets/platform.png" alt="platform" />
      <img src="./assets/platform.png" alt="platform" />
      <img src="./assets/platform.png" alt="platform" />
      <img src="./assets/platform.png" alt="platform" /> -->
    </div>

    <script src="script.js"></script>
  </body>
</html>
